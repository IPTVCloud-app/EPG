name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check commit message
        id: check
        run: |
          MSG="$(git log -1 --pretty=%B || echo '')"
          echo "Last commit message:"
          echo "$MSG"

          if echo "$MSG" | grep -qi "chore update:"; then
            echo "match=true" >> $GITHUB_OUTPUT
          else
            echo "match=false" >> $GITHUB_OUTPUT
          fi
        
      - name: Skip if no match
        if: steps.check.outputs.match != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "No 'chore update:' found. Skipping deploy."
          exit 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare files
        run: |
          mkdir -p sites/thumbnails

          [ -f content.json ] && mv -f content.json sites/
          [ -f streams.json ] && mv -f streams.json sites/
          [ -f thumbnails.json ] && mv -f thumbnails.json sites/

          if ls thumbnails/*.webp 1> /dev/null 2>&1; then
            mv -f thumbnails/*.webp sites/thumbnails/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
